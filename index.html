<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Офлайн Аркади для Двох</title>
<style>
  :root {
    --bg-dark: #070913;
    --table-surface: #0b1124;
    --card-bg: #0f172a;
    --border-color: rgba(255, 255, 255, 0.16);
    --p1-color: #00f0ff;
    --p1-glow: rgba(0, 240, 255, 0.45);
    --p2-color: #ff0055;
    --p2-glow: rgba(255, 0, 85, 0.45);
    --gold: #facc15;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --hud-pill-bg: rgba(7, 9, 19, 0.55);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 24px;
    --radius-btn: 50%;
    --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* СТРОГИЙ ДВОКОЛІРНИЙ: БІЛЕ НА ЧОРНОМУ */
  body.theme-dark {
    --bg-dark: #000000 !important;
    --table-surface: #000000 !important;
    --card-bg: #000000 !important;
    --border-color: #ffffff !important;
    --p1-color: #ffffff !important;
    --p1-glow: transparent !important;
    --p2-color: #ffffff !important;
    --p2-glow: transparent !important;
    --gold: #ffffff !important;
    --text-main: #ffffff !important;
    --text-muted: #ffffff !important;
    --hud-pill-bg: #000000 !important;
  }
  body.theme-dark canvas {
    box-shadow: none !important;
    border: 2px solid #ffffff !important;
  }
  body.theme-dark .p1-color,
  body.theme-dark .p2-color {
    text-shadow: none !important;
  }
  body.theme-dark .player-info,
  body.theme-dark .score-box {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    padding: 4px 10px !important;
    border-radius: var(--radius-sm);
  }
  body.theme-dark .modal-overlay {
    background: rgba(0, 0, 0, 0.92) !important;
    backdrop-filter: none !important;
  }
  body.theme-dark .modal-card {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark .sub-options-box,
  body.theme-dark .stats-grid {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
  }
  body.theme-dark .round-btn,
  body.theme-dark .target-btn,
  body.theme-dark .mode-btn,
  body.theme-dark .btn-secondary,
  body.theme-dark .btn-download {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    color: #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark .target-btn.active,
  body.theme-dark .mode-btn.active,
  body.theme-dark .btn-primary {
    background: #ffffff !important;
    color: #000000 !important;
    border: 2px solid #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark #goal-splash {
    background: #000000 !important;
    color: #ffffff !important;
    border: 3px solid #ffffff !important;
    text-shadow: none !important;
  }
  body.theme-dark .emo {
    filter: grayscale(100%) contrast(1.3);
  }
  /* СТРОГИЙ ДВОКОЛІРНИЙ: ЧОРНЕ НА БІЛОМУ */
  body.theme-light {
    --bg-dark: #ffffff !important;
    --table-surface: #ffffff !important;
    --card-bg: #ffffff !important;
    --border-color: #000000 !important;
    --p1-color: #000000 !important;
    --p1-glow: transparent !important;
    --p2-color: #000000 !important;
    --p2-glow: transparent !important;
    --gold: #000000 !important;
    --text-main: #000000 !important;
    --text-muted: #000000 !important;
    --hud-pill-bg: #ffffff !important;
  }
  body.theme-light canvas {
    box-shadow: none !important;
    border: 2px solid #000000 !important;
  }
  body.theme-light .p1-color,
  body.theme-light .p2-color {
    text-shadow: none !important;
  }
  body.theme-light .player-info,
  body.theme-light .score-box {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    padding: 4px 10px !important;
    border-radius: var(--radius-sm);
  }
  body.theme-light .modal-overlay {
    background: rgba(255, 255, 255, 0.92) !important;
    backdrop-filter: none !important;
  }
  body.theme-light .modal-card {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light .sub-options-box,
  body.theme-light .stats-grid {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
  }
  body.theme-light .round-btn,
  body.theme-light .target-btn,
  body.theme-light .mode-btn,
  body.theme-light .btn-secondary,
  body.theme-light .btn-download {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    color: #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light .target-btn.active,
  body.theme-light .mode-btn.active,
  body.theme-light .btn-primary {
    background: #000000 !important;
    color: #ffffff !important;
    border: 2px solid #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light #goal-splash {
    background: #ffffff !important;
    color: #000000 !important;
    border: 3px solid #000000 !important;
    text-shadow: none !important;
  }
  body.theme-light .emo {
    filter: grayscale(100%) contrast(1.3);
  }
  /* ПІКСЕЛЬНИЙ СТИЛЬ */
  body.style-pixel {
    --radius-sm: 0px !important;
    --radius-md: 0px !important;
    --radius-lg: 0px !important;
    --radius-btn: 0px !important;
    --app-font: ui-monospace, "Courier New", monospace !important;
  }
  body.style-pixel * {
    border-radius: 0px !important;
    letter-spacing: 0.4px;
  }
  body.style-pixel .btn,
  body.style-pixel .target-btn,
  body.style-pixel .mode-btn,
  body.style-pixel .round-btn {
    box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.7) !important;
  }
  body.theme-dark.style-pixel .btn,
  body.theme-dark.style-pixel .target-btn,
  body.theme-dark.style-pixel .mode-btn,
  body.theme-dark.style-pixel .round-btn,
  body.theme-dark.style-pixel .modal-card {
    box-shadow: 4px 4px 0px #ffffff !important;
  }
  body.theme-light.style-pixel .btn,
  body.theme-light.style-pixel .target-btn,
  body.theme-light.style-pixel .mode-btn,
  body.theme-light.style-pixel .round-btn,
  body.theme-light.style-pixel .modal-card {
    box-shadow: 4px 4px 0px #000000 !important;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: var(--app-font);
    color: var(--text-main);
    touch-action: none;
    transition: background-color 0.15s;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #stage-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px var(--p1-glow);
    background-color: var(--table-surface);
    border-radius: var(--radius-lg);
    touch-action: none;
  }
  .player-ui {
    position: absolute;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    pointer-events: none;
    z-index: 10;
  }
  #ui-top {
    top: 0;
    transform: rotate(180deg);
  }
  #ui-bottom {
    bottom: 0;
  }
  .player-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--hud-pill-bg);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    backdrop-filter: blur(4px);
  }
  .player-name {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .p1-color { color: var(--p1-color); text-shadow: 0 0 10px var(--p1-glow); }
  .p2-color { color: var(--p2-color); text-shadow: 0 0 10px var(--p2-glow); }
  .stat-badge {
    font-size: 11px;
    color: var(--text-main);
    font-weight: 700;
    opacity: 0.9;
  }
  .score-box {
    font-size: 32px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    background: var(--hud-pill-bg);
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    backdrop-filter: blur(4px);
  }
  #side-controls {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 20;
  }
  .round-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-btn);
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
    pointer-events: auto;
  }
  .round-btn svg {
    width: 18px;
    height: 18px;
    display: block;
  }
  .round-btn:active {
    transform: scale(0.92);
    border-color: var(--p1-color);
  }
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 19, 0.88);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 18px 15px;
    width: 94%;
    max-width: 410px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    max-height: 95vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
  }
  .modal-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.35;
  }
  .section-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .mode-selector {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 12px;
  }
  .mode-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 8px 2px;
    border-radius: var(--radius-md);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--p1-color);
    color: #030712;
    border-color: var(--p1-color);
  }
  .sub-options-box {
    background: rgba(0, 0, 0, 0.25);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 8px;
    margin-bottom: 10px;
  }
  .opt-buttons {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .target-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 5px 9px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .target-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    font-weight: 700;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
    background: rgba(0, 0, 0, 0.22);
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 15px;
    font-weight: 700;
  }
  .menu-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--p1-color), #00a8ff);
    color: #030712;
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }
  .btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
  }
  #goal-splash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 0.8px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.28s ease;
    z-index: 50;
    text-align: center;
    text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 255, 255, 0.6);
    background: rgba(7, 9, 19, 0.85);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    width: 84%;
  }
  #goal-splash.active {
    transform: translate(-50%, -50%) scale(1.02);
    opacity: 1;
  }
</style>
</head>
<body class="theme-colorful style-round">
<div id="game-wrapper">
  <div id="stage-box">
    <!-- Верхній гравець (P2) -->
    <div id="ui-top" class="player-ui">
      <div class="player-info">
        <span class="player-name p2-color">Гравець 2</span>
        <span class="stat-badge"><span id="lbl-p2-stat">Очки</span>: <span id="p2-hits">0</span></span>
      </div>
      <div id="p2-score" class="score-box p2-color">0</div>
    </div>
    <canvas id="hockey-canvas"></canvas>
    <!-- Нижній гравець (P1) -->
    <div id="ui-bottom" class="player-ui">
      <div class="player-info">
        <span class="player-name p1-color">Гравець 1</span>
        <span class="stat-badge"><span id="lbl-p1-stat">Очки</span>: <span id="p1-hits">0</span></span>
      </div>
      <div id="p1-score" class="score-box p1-color">0</div>
    </div>
    <!-- Швидке керування -->
    <div id="side-controls">
      <button id="btn-pause" class="round-btn" title="Пауза / Меню" aria-label="Пауза">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="btn-sound" class="round-btn" title="Звук" aria-label="Звук">
        <svg id="icon-sound-on" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>
    <div id="goal-splash">ГОЛ!</div>
  </div>
  <!-- Меню / Налаштування -->
  <div id="menu-modal" class="modal-overlay active">
    <div class="modal-card">
      <h2 id="modal-heading" class="modal-title">КОСМІЧНА БИТВА</h2>
      <p id="modal-desc" class="modal-subtitle">Унікальні хвилі й арени • Збирайте бонуси ⚡🔱🛡️ • Бережіть напарника в коопі!</p>
      <div class="sub-options-box">
        <div style="margin-bottom: 6px;">
          <div class="section-label">Колір інтерфейсу:</div>
          <div class="opt-buttons">
            <button id="theme-btn-color" class="target-btn active"><span class="emo">🌈</span> Барвиста</button>
            <button id="theme-btn-dark" class="target-btn"><span class="emo">🌙</span> Біле/Чорному</button>
            <button id="theme-btn-light" class="target-btn"><span class="emo">☀️</span> Чорне/Білому</button>
          </div>
        </div>
        <div>
          <div class="section-label">Стиль форм:</div>
          <div class="opt-buttons">
            <button id="style-btn-round" class="target-btn active"><span class="emo">⚪</span> Округлий</button>
            <button id="style-btn-pixel" class="target-btn"><span class="emo">⬛</span> Піксельний</button>
          </div>
        </div>
      </div>
      <div class="section-label">Виберіть гру:</div>
      <div class="mode-selector">
        <button id="mode-hockey" class="mode-btn"><span class="emo">🏑</span> Хокей</button>
        <button id="mode-mario" class="mode-btn"><span class="emo">🍄</span> Маріо</button>
        <button id="mode-invaders" class="mode-btn active"><span class="emo">👾</span> Космос</button>
        <button id="mode-snake" class="mode-btn"><span class="emo">🐍</span> Змійка</button>
      </div>
      <div id="invaders-options" class="sub-options-box">
        <div class="section-label">Режим космічного бою:</div>
        <div class="opt-buttons">
          <button id="inv-coop" class="target-btn active"><span class="emo">👾</span> Навала (Кооп)</button>
          <button id="inv-simple" class="target-btn"><span class="emo">🛡️</span> Прості</button>
          <button id="inv-complex" class="target-btn"><span class="emo">🏰</span> Складні</button>
        </div>
      </div>
      <div id="snake-options" class="sub-options-box" style="display: none;">
        <div style="margin-bottom: 6px;">
          <div class="section-label">Стіни арени:</div>
          <div class="opt-buttons">
            <button id="wall-looped" class="target-btn active"><span class="emo">🔄</span> Наскрізні</button>
            <button id="wall-deadly" class="target-btn"><span class="emo">💀</span> Смертельні</button>
          </div>
        </div>
        <div>
          <div class="section-label">Тип змійки:</div>
          <div class="opt-buttons">
            <button id="style-flex" class="target-btn active"><span class="emo">〰️</span> Гнучка</button>
            <button id="style-pixel" class="target-btn"><span class="emo">🧱</span> Піксельна</button>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span id="lbl-total-stat" class="stat-label">Усього дій</span>
          <span id="stat-total-hits" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span id="lbl-rally-stat" class="stat-label">Серія</span>
          <span id="stat-rally" class="stat-val">0</span>
        </div>
      </div>
      <div class="section-label">Перемога за очками:</div>
      <div class="target-score-selector" style="display:flex; justify-content:center; gap:5px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="target-btn" data-score="5">5</button>
        <button class="target-btn active" data-score="10">10</button>
        <button class="target-btn" data-score="15">15</button>
        <button class="target-btn" data-score="25">25</button>
        <button class="target-btn" data-score="50">50</button>
        <button class="target-btn" data-score="0">∞</button>
      </div>
      <div class="menu-actions">

      osc.frequency.setValueAtTime(380 + Math.min(intensity * 320, 620), t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.06);
      gain.gain.setValueAtTime(Math.min(Math.max(intensity * 0.35, 0.12), 0.6), t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.06);
    } catch (e) {}
  }

  ctx.fillStyle = theme.isBW ? theme.surface : '#ff0055';
  ctx.strokeStyle = theme.isBW ? theme.fg : '#ff0055';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(barL + barW * p2Prog, 680, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  drawCanvasBadge(14, 680, `РІВЕНЬ ${marioWorld.level}`, 'left');
}
function drawSharedEffects() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.scope === 'mario') continue;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < floatingTexts.length; i++) {
    const ft = floatingTexts[i];
    if (ft.scope !== 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.translate(ft.x, ft.y);
    if (ft.rotated) ctx.rotate(Math.PI);
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, 0, 0);
    ctx.restore();
  }
}
function updateVisualEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.alpha -= 0.02;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}
/**
 * ============================================================================
 * ГОЛОВНИЙ ЦИКЛ З ФІКСОВАНИМ КРОКОМ 60Hz
 * ============================================================================
 */
const FIXED_STEP = 1000 / 60;
let lastFrameTime = 0;
let accumulator = 0;
function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const elapsed = Math.min(80, Math.max(0, now - lastFrameTime));
  lastFrameTime = now;
  accumulator += elapsed;
  while (accumulator >= FIXED_STEP) {
    if (gameState === 'PLAYING') {
      if (currentMode === 'HOCKEY') updateHockeyPhysics();
      else if (currentMode === 'INVADERS') updateInvadersPhysics();
      else if (currentMode === 'SNAKE') updateSnakePhysics();
      else if (currentMode === 'MARIO') updateMarioPhysics();
    }
    if (gameState === 'PLAYING' || gameState === 'POINT_PAUSE') {
      updateVisualEffects();
    }
    accumulator -= FIXED_STEP;
  }
  ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
  if (currentMode === 'HOCKEY') drawHockeyField();
  else if (currentMode === 'INVADERS') drawInvadersField();
  else if (currentMode === 'SNAKE') drawSnakeField();
  else if (currentMode === 'MARIO') drawMarioSplitScreen();
  drawSharedEffects();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
