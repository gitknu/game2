<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Офлайн Аркади для Двох</title>
<style>
  :root {
    --bg-dark: #070913;
    --table-surface: #0b1124;
    --card-bg: #0f172a;
    --border-color: rgba(255, 255, 255, 0.16);
    --p1-color: #00f0ff;
    --p1-glow: rgba(0, 240, 255, 0.45);
    --p2-color: #ff0055;
    --p2-glow: rgba(255, 0, 85, 0.45);
    --gold: #facc15;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --hud-pill-bg: rgba(7, 9, 19, 0.55);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 24px;
    --radius-btn: 50%;
    --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* СТРОГИЙ ДВОКОЛІРНИЙ: БІЛЕ НА ЧОРНОМУ */
  body.theme-dark {
    --bg-dark: #000000 !important;
    --table-surface: #000000 !important;
    --card-bg: #000000 !important;
    --border-color: #ffffff !important;
    --p1-color: #ffffff !important;
    --p1-glow: transparent !important;
    --p2-color: #ffffff !important;
    --p2-glow: transparent !important;
    --gold: #ffffff !important;
    --text-main: #ffffff !important;
    --text-muted: #ffffff !important;
    --hud-pill-bg: #000000 !important;
  }
  body.theme-dark canvas {
    box-shadow: none !important;
    border: 2px solid #ffffff !important;
  }
  body.theme-dark .p1-color,
  body.theme-dark .p2-color {
    text-shadow: none !important;
  }
  body.theme-dark .player-info,
  body.theme-dark .score-box {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    padding: 4px 10px !important;
    border-radius: var(--radius-sm);
  }
  body.theme-dark .modal-overlay {
    background: rgba(0, 0, 0, 0.92) !important;
    backdrop-filter: none !important;
  }
  body.theme-dark .modal-card {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark .sub-options-box,
  body.theme-dark .stats-grid {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
  }
  body.theme-dark .round-btn,
  body.theme-dark .target-btn,
  body.theme-dark .mode-btn,
  body.theme-dark .btn-secondary,
  body.theme-dark .btn-download {
    background: #000000 !important;
    border: 2px solid #ffffff !important;
    color: #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark .target-btn.active,
  body.theme-dark .mode-btn.active,
  body.theme-dark .btn-primary {
    background: #ffffff !important;
    color: #000000 !important;
    border: 2px solid #ffffff !important;
    box-shadow: none !important;
  }
  body.theme-dark #goal-splash {
    background: #000000 !important;
    color: #ffffff !important;
    border: 3px solid #ffffff !important;
    text-shadow: none !important;
  }
  body.theme-dark .emo {
    filter: grayscale(100%) contrast(1.3);
  }
  /* СТРОГИЙ ДВОКОЛІРНИЙ: ЧОРНЕ НА БІЛОМУ */
  body.theme-light {
    --bg-dark: #ffffff !important;
    --table-surface: #ffffff !important;
    --card-bg: #ffffff !important;
    --border-color: #000000 !important;
    --p1-color: #000000 !important;
    --p1-glow: transparent !important;
    --p2-color: #000000 !important;
    --p2-glow: transparent !important;
    --gold: #000000 !important;
    --text-main: #000000 !important;
    --text-muted: #000000 !important;
    --hud-pill-bg: #ffffff !important;
  }
  body.theme-light canvas {
    box-shadow: none !important;
    border: 2px solid #000000 !important;
  }
  body.theme-light .p1-color,
  body.theme-light .p2-color {
    text-shadow: none !important;
  }
  body.theme-light .player-info,
  body.theme-light .score-box {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    padding: 4px 10px !important;
    border-radius: var(--radius-sm);
  }
  body.theme-light .modal-overlay {
    background: rgba(255, 255, 255, 0.92) !important;
    backdrop-filter: none !important;
  }
  body.theme-light .modal-card {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light .sub-options-box,
  body.theme-light .stats-grid {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
  }
  body.theme-light .round-btn,
  body.theme-light .target-btn,
  body.theme-light .mode-btn,
  body.theme-light .btn-secondary,
  body.theme-light .btn-download {
    background: #ffffff !important;
    border: 2px solid #000000 !important;
    color: #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light .target-btn.active,
  body.theme-light .mode-btn.active,
  body.theme-light .btn-primary {
    background: #000000 !important;
    color: #ffffff !important;
    border: 2px solid #000000 !important;
    box-shadow: none !important;
  }
  body.theme-light #goal-splash {
    background: #ffffff !important;
    color: #000000 !important;
    border: 3px solid #000000 !important;
    text-shadow: none !important;
  }
  body.theme-light .emo {
    filter: grayscale(100%) contrast(1.3);
  }
  /* ПІКСЕЛЬНИЙ СТИЛЬ */
  body.style-pixel {
    --radius-sm: 0px !important;
    --radius-md: 0px !important;
    --radius-lg: 0px !important;
    --radius-btn: 0px !important;
    --app-font: ui-monospace, "Courier New", monospace !important;
  }
  body.style-pixel * {
    border-radius: 0px !important;
    letter-spacing: 0.4px;
  }
  body.style-pixel .btn,
  body.style-pixel .target-btn,
  body.style-pixel .mode-btn,
  body.style-pixel .round-btn {
    box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.7) !important;
  }
  body.theme-dark.style-pixel .btn,
  body.theme-dark.style-pixel .target-btn,
  body.theme-dark.style-pixel .mode-btn,
  body.theme-dark.style-pixel .round-btn,
  body.theme-dark.style-pixel .modal-card {
    box-shadow: 4px 4px 0px #ffffff !important;
  }
  body.theme-light.style-pixel .btn,
  body.theme-light.style-pixel .target-btn,
  body.theme-light.style-pixel .mode-btn,
  body.theme-light.style-pixel .round-btn,
  body.theme-light.style-pixel .modal-card {
    box-shadow: 4px 4px 0px #000000 !important;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: var(--app-font);
    color: var(--text-main);
    touch-action: none;
    transition: background-color 0.15s;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #stage-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px var(--p1-glow);
    background-color: var(--table-surface);
    border-radius: var(--radius-lg);
    touch-action: none;
  }
  .player-ui {
    position: absolute;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    pointer-events: none;
    z-index: 10;
  }
  #ui-top {
    top: 0;
    transform: rotate(180deg);
  }
  #ui-bottom {
    bottom: 0;
  }
  .player-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--hud-pill-bg);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    backdrop-filter: blur(4px);
  }
  .player-name {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .p1-color { color: var(--p1-color); text-shadow: 0 0 10px var(--p1-glow); }
  .p2-color { color: var(--p2-color); text-shadow: 0 0 10px var(--p2-glow); }
  .stat-badge {
    font-size: 11px;
    color: var(--text-main);
    font-weight: 700;
    opacity: 0.9;
  }
  .score-box {
    font-size: 32px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    background: var(--hud-pill-bg);
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    backdrop-filter: blur(4px);
  }
  #side-controls {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 20;
  }
  .round-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-btn);
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
    pointer-events: auto;
  }
  .round-btn svg {
    width: 18px;
    height: 18px;
    display: block;
  }
  .round-btn:active {
    transform: scale(0.92);
    border-color: var(--p1-color);
  }
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 19, 0.88);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 18px 15px;
    width: 94%;
    max-width: 410px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    max-height: 95vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 3px;
    letter-spacing: 0.5px;
  }
  .modal-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.35;
  }
  .section-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .mode-selector {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 12px;
  }
  .mode-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 8px 2px;
    border-radius: var(--radius-md);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--p1-color);
    color: #030712;
    border-color: var(--p1-color);
  }
  .sub-options-box {
    background: rgba(0, 0, 0, 0.25);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 8px;
    margin-bottom: 10px;
  }
  .opt-buttons {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .target-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 5px 9px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .target-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    font-weight: 700;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
    background: rgba(0, 0, 0, 0.22);
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 15px;
    font-weight: 700;
  }
  .menu-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--p1-color), #00a8ff);
    color: #030712;
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }
  .btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
  }
  #goal-splash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.8px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.28s ease;
    z-index: 50;
    text-align: center;
    text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 255, 255, 0.6);
    background: rgba(7, 9, 19, 0.82);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    width: 84%;
  }
  #goal-splash.active {
    transform: translate(-50%, -50%) scale(1.02);
    opacity: 1;
  }
</style>
</head>
<body class="theme-colorful style-round">
<div id="game-wrapper">
  <div id="stage-box">
    <!-- Верхній гравець (P2) -->
    <div id="ui-top" class="player-ui">
      <div class="player-info">
        <span class="player-name p2-color">Гравець 2</span>
        <span class="stat-badge"><span id="lbl-p2-stat">Очки</span>: <span id="p2-hits">0</span></span>
      </div>
      <div id="p2-score" class="score-box p2-color">0</div>
    </div>
    <canvas id="hockey-canvas"></canvas>
    <!-- Нижній гравець (P1) -->
    <div id="ui-bottom" class="player-ui">
      <div class="player-info">
        <span class="player-name p1-color">Гравець 1</span>
        <span class="stat-badge"><span id="lbl-p1-stat">Очки</span>: <span id="p1-hits">0</span></span>
      </div>
      <div id="p1-score" class="score-box p1-color">0</div>
    </div>
    <!-- Швидке керування -->
    <div id="side-controls">
      <button id="btn-pause" class="round-btn" title="Пауза / Меню" aria-label="Пауза">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="btn-sound" class="round-btn" title="Звук" aria-label="Звук">
        <svg id="icon-sound-on" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>
    <div id="goal-splash">ГОЛ!</div>
  </div>
  <!-- Меню / Налаштування -->
  <div id="menu-modal" class="modal-overlay active">
    <div class="modal-card">
      <h2 id="modal-heading" class="modal-title">КОСМІЧНА БИТВА</h2>
      <p id="modal-desc" class="modal-subtitle">Водіть пальцем для руху й стрільби • У коопі бережіть напарника!</p>
      <div class="sub-options-box">
        <div style="margin-bottom: 6px;">
          <div class="section-label">Колір інтерфейсу:</div>
          <div class="opt-buttons">
            <button id="theme-btn-color" class="target-btn active"><span class="emo">🌈</span> Барвиста</button>
            <button id="theme-btn-dark" class="target-btn"><span class="emo">🌙</span> Біле/Чорному</button>
            <button id="theme-btn-light" class="target-btn"><span class="emo">☀️</span> Чорне/Білому</button>
          </div>
        </div>
        <div>
          <div class="section-label">Стиль форм:</div>
          <div class="opt-buttons">
            <button id="style-btn-round" class="target-btn active"><span class="emo">⚪</span> Округлий</button>
            <button id="style-btn-pixel" class="target-btn"><span class="emo">⬛</span> Піксельний</button>
          </div>
        </div>
      </div>
      <div class="section-label">Виберіть гру:</div>
      <div class="mode-selector">
        <button id="mode-hockey" class="mode-btn"><span class="emo">🏑</span> Хокей</button>
        <button id="mode-mario" class="mode-btn"><span class="emo">🍄</span> Маріо</button>
        <button id="mode-invaders" class="mode-btn active"><span class="emo">👾</span> Космос</button>
        <button id="mode-snake" class="mode-btn"><span class="emo">🐍</span> Змійка</button>
      </div>
      <div id="invaders-options" class="sub-options-box">
        <div class="section-label">Режим космічного бою:</div>
        <div class="opt-buttons">
          <button id="inv-coop" class="target-btn active"><span class="emo">👾</span> Навала (Кооп)</button>
          <button id="inv-simple" class="target-btn"><span class="emo">🛡️</span> Прості</button>
          <button id="inv-complex" class="target-btn"><span class="emo">🏰</span> Складні</button>
        </div>
      </div>
      <div id="snake-options" class="sub-options-box" style="display: none;">
        <div style="margin-bottom: 6px;">
          <div class="section-label">Стіни арени:</div>
          <div class="opt-buttons">
            <button id="wall-looped" class="target-btn active"><span class="emo">🔄</span> Наскрізні</button>
            <button id="wall-deadly" class="target-btn"><span class="emo">💀</span> Смертельні</button>
          </div>
        </div>
        <div>
          <div class="section-label">Тип змійки:</div>
          <div class="opt-buttons">
            <button id="style-flex" class="target-btn active"><span class="emo">〰️</span> Гнучка</button>
            <button id="style-pixel" class="target-btn"><span class="emo">🧱</span> Піксельна</button>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span id="lbl-total-stat" class="stat-label">Усього дій</span>
          <span id="stat-total-hits" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span id="lbl-rally-stat" class="stat-label">Серія</span>
          <span id="stat-rally" class="stat-val">0</span>
        </div>
      </div>
      <div class="section-label">Перемога за очками:</div>
      <div class="target-score-selector" style="display:flex; justify-content:center; gap:6px; margin-bottom:12px;">
        <button class="target-btn" data-score="5">5</button>
        <button class="target-btn active" data-score="10">10</button>
        <button class="target-btn" data-score="15">15</button>
        <button class="target-btn" data-score="25">25</button>
      </div>
      <div class="menu-actions">
        <button id="btn-play-resume" class="btn btn-primary">Почати матч</button>
        <button id="btn-reset-game" class="btn btn-secondary">Скинути рахунок</button>
        <button id="btn-export-html" class="btn btn-download"><span class="emo">💾</span> Зберегти офлайн (.html)</button>
      </div>
    </div>
  </div>
</div>
<script>
/**
 * СИНТЕЗАТОР ЗВУКУ (Web Audio API — 100% автономно)

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }
  playHit(intensity = 1) {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(380 + Math.min(intensity * 320, 620), t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.06);
      gain.gain.setValueAtTime(Math.min(Math.max(intensity * 0.35, 0.12), 0.6), t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.06);
    } catch (e) {}
  }
  playWallBounce() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(190, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.05);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.05);
    } catch (e) {}
  }
  playLaser(isP1) {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(isP1 ? 880 : 690, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.08);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.08);
    } catch (e) {}
  }
  playEat() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, t);
      osc.frequency.setValueAtTime(880.00, t + 0.05);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.12);
    } catch (e) {}
  }
  playCoin() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(987.77, t);
      osc.frequency.setValueAtTime(1318.51, t + 0.07);
      gain.gain.setValueAtTime(0.11, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.24);
    } catch (e) {}
  }
  playJump() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(580, t + 0.11);
      gain.gain.setValueAtTime(0.11, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.11);
    } catch (e) {}
  }
  playBrickBump() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.07);
      gain.gain.setValueAtTime(0.24, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.07);
    } catch (e) {}
  }
  playPowerup() {
    if (!this.enabled || !this.ctx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, idx) => {
        const t = this.ctx.currentTime + idx * 0.055;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.12);
      });
    } catch (e) {}
  }
  playExplosion() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const bufferSize = Math.floor(this.ctx.sampleRate * 0.18);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(650, t);
      filter.frequency.linearRampToValueAtTime(70, t + 0.18);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.32, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
      noise.start(t);
    } catch (e) {}
  }
  playGoal() {
    if (!this.enabled || !this.ctx) return;
    try {
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const t = this.ctx.currentTime + idx * 0.08;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.25);
      });
    } catch (e) {}
  }
}

function updateHockeyPhysics() {
  // Клавіатурне керування для ПК
  const kbSpd = 12;
  if (keyState['KeyA']) mallet1.targetX -= kbSpd;
  if (keyState['KeyD']) mallet1.targetX += kbSpd;
  if (keyState['KeyW']) mallet1.targetY -= kbSpd;
  if (keyState['KeyS']) mallet1.targetY += kbSpd;
  if (keyState['ArrowLeft']) mallet2.targetX -= kbSpd;
  if (keyState['ArrowRight']) mallet2.targetX += kbSpd;
  if (keyState['ArrowUp']) mallet2.targetY -= kbSpd;
  if (keyState['ArrowDown']) mallet2.targetY += kbSpd;

  mallet2.targetX = Math.max(BORDER + mallet2.radius, Math.min(V_WIDTH - BORDER - mallet2.radius, mallet2.targetX));
  mallet2.targetY = Math.max(BORDER + mallet2.radius, Math.min(V_HEIGHT / 2 - mallet2.radius, mallet2.targetY));

    const cx = Math.max(BORDER + m.radius, Math.min(V_WIDTH - BORDER - m.radius, m.targetX));
    const cy = Math.max(minY + m.radius, Math.min(maxY - m.radius, m.targetY));
    m.vx = Math.max(-45, Math.min(45, (cx - m.x) * 0.45));
    m.vy = Math.max(-45, Math.min(45, (cy - m.y) * 0.45));
    m.x += m.vx; m.y += m.vy;
  }
  updateM(mallet1, V_HEIGHT / 2, V_HEIGHT - BORDER);
  updateM(mallet2, BORDER, V_HEIGHT / 2);

  const gR = (V_WIDTH + GOAL_WIDTH) / 2;
  const posts = [
    { x: gL, y: BORDER }, { x: gR, y: BORDER },
    { x: gL, y: V_HEIGHT - BORDER }, { x: gR, y: V_HEIGHT - BORDER }
  ];

  for (let s = 0; s < SUB_STEPS; s++) {

            puck.vx = (puck.vx / spd) * puck.maxSpeed;

    } else if (puck.x + puck.radius >= V_WIDTH - BORDER) {

    for (let pIdx = 0; pIdx < posts.length; pIdx++) {

        }
      } else {

      }
    }
    if (puck.y + puck.radius >= V_HEIGHT - BORDER) {
      if (puck.x >= gL && puck.x <= gR) {
        if (puck.y > V_HEIGHT - BORDER + 18) {
          createSparks(puck.x, V_HEIGHT - BORDER, '#ff0055', 28);
          triggerPoint(2);
          break;
        }
      } else {
        puck.y = V_HEIGHT - BORDER - puck.radius; puck.vy = -Math.abs(puck.vy) * 0.95; sound.playWallBounce();
      }
    }
  }

  }

  marioWorld.coins.forEach(c => {

      if (p2Runner.coins % 3 === 0) {

      } else {
        addFloatingText(c.x, c.y, '+1 🪙', '#facc15', 2);
        updateScoreDOM();
      }
    }
  });

  // Флагшток фінішу
  if (!marioWorld.flagReached && (p1Runner.x >= marioWorld.flagX || p2Runner.x >= marioWorld.flagX)) {
    const winner = p1Runner.x >= marioWorld.flagX ? 1 : 2;
    marioWorld.flagReached = true;

    if (winner === 1) p1Score += 5; else p2Score += 5;

  p2Hits = p2Runner.coins;

  updateScoreDOM();
}
function triggerPoint(scorer) {

  if (targetP === 0) puck.y = V_HEIGHT / 2;

function drawHockeyField() {
  const theme = getThemeColors();
  const gL = (V_WIDTH - GOAL_WIDTH) / 2;
  const gR = (V_WIDTH + GOAL_WIDTH) / 2;
  if (theme.isBW) {
    ctx.save();

    ctx.beginPath(); ctx.arc(V_WIDTH / 2, V_HEIGHT - BORDER, 170, Math.PI, 0); ctx.stroke();

    ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(mallet2.x, mallet2.y, mallet2.radius * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = theme.fg; ctx.fill();

  // ПОВНОЦІННИЙ РЕАЛІСТИЧНИЙ ХОКЕЙ

  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';

    }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 4;

  ctx.beginPath(); ctx.arc(V_WIDTH / 2, V_HEIGHT / 2, 110, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 0, 85, 0.35)'; ctx.beginPath(); ctx.arc(V_WIDTH / 2, BORDER, 180, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)'; ctx.beginPath(); ctx.arc(V_WIDTH / 2, V_HEIGHT - BORDER, 180, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, BORDER, V_HEIGHT); ctx.fillRect(V_WIDTH - BORDER, 0, BORDER, V_HEIGHT);
  ctx.fillRect(0, 0, gL, BORDER); ctx.fillRect(gR, 0, V_WIDTH - gR, BORDER);
  ctx.fillRect(0, V_HEIGHT - BORDER, gL, BORDER); ctx.fillRect(gR, V_HEIGHT - BORDER, V_WIDTH - gR, BORDER);
  ctx.strokeStyle = 'rgba(255, 0, 85, 0.9)'; ctx.lineWidth = 5;

  grad.addColorStop(0, '#fffbeb'); grad.addColorStop(0.3, '#facc15'); grad.addColorStop(0.85, '#ca8a04'); grad.addColorStop(1, '#713f12');

  const drawMallet = (m, col) => {
    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fillStyle = '#0f172a'; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = col; ctx.stroke();
    const mg = ctx.createRadialGradient(m.x - 6, m.y - 8, 4, m.x, m.y, m.radius * 0.65);

  };
  drawMallet(mallet1, '#00f0ff');

      }

      ctx.fillRect(2, -16, 4, 4);
      ctx.fillRect(0, -11, 9, 3);
      ctx.fillStyle = overallColor;
      ctx.fillRect(-10, -8, 20, 16);
      ctx.fillStyle = capColor;
      ctx.fillRect(-6, -8, 12, 7);
      ctx.fillStyle = theme.isBW ? theme.fg : '#78350f';

    }
    ctx.restore();

  };
  if (theme.isBW) {
    drawMarioSprite(p1Runner, 1, theme.fg, theme.fg, false);

  } else {
    drawMarioSprite(p1Runner, 1, '#ef4444', '#1d4ed8', false);

  }
  // Плаваючий текст у світі Маріо
  for (let i = 0; i < floatingTexts.length; i++) {
    const ft = floatingTexts[i];
    if (ft.scope !== viewPlayerNum) continue;

    ctx.globalAlpha = Math.max(0, ft.alpha);

    ctx.save();

  drawTouchBtn(MARIO_BTN.jump, '▲', ctrl.jump || (viewPlayerNum === 1 ? (keyState['KeyW'] || keyState['Space']) : keyState['ArrowUp']));

function drawMarioSplitScreen() {
  const maxCam = Math.max(0, marioWorld.flagX + 260 - V_WIDTH);
  const camX1 = Math.max(0, Math.min(maxCam, p1Runner.x - 240));
  const camX2 = Math.max(0, Math.min(maxCam, p2Runner.x - 240));
  const theme = getThemeColors();
  // Верхній екран (Гравець 2, перевернутий на 180°)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, V_WIDTH, 680);
  ctx.clip();
  ctx.translate(V_WIDTH / 2, 340);
  ctx.rotate(Math.PI);
  ctx.translate(-V_WIDTH / 2, -340);
  drawMarioViewport(camX2, 2);
  ctx.restore();
  // Нижній екран (Гравець 1)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 680, V_WIDTH, 680);
  ctx.clip();
  ctx.translate(0, 680);
  drawMarioViewport(camX1, 1);
  ctx.restore();
  // Центральна смуга прогресу перегонів
  ctx.fillStyle = theme.isBW ? theme.surface : '#070913';
  ctx.fillRect(0, 672, V_WIDTH, 16);
  ctx.strokeStyle = theme.isBW ? theme.fg : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 672); ctx.lineTo(V_WIDTH, 672); ctx.moveTo(0, 688); ctx.lineTo(V_WIDTH, 688); ctx.stroke();
  const barL = 55, barR = V_WIDTH - 55, barW = barR - barL;
  const p1Prog = Math.max(0, Math.min(1, p1Runner.x / marioWorld.flagX));
  const p2Prog = Math.max(0, Math.min(1, p2Runner.x / marioWorld.flagX));
  ctx.fillStyle = theme.isBW ? theme.fg : '#00f0ff';
  ctx.beginPath(); ctx.arc(barL + barW * p1Prog, 680, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = theme.isBW ? theme.surface : '#ff0055';
  ctx.strokeStyle = theme.isBW ? theme.fg : '#ff0055';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(barL + barW * p2Prog, 680, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}
function drawSharedEffects() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.scope === 'mario') continue;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < floatingTexts.length; i++) {
    const ft = floatingTexts[i];
    if (ft.scope !== 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }
}
function updateVisualEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.alpha -= 0.022;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}
// Перехоплюємо createSparks у Маріо щоб частинки автоматично прив'язувались до світу Маріо
const _origCreateSparks = createSparks;
createSparks = function(x, y, color, count = 12) {
  const theme = getThemeColors();
  const sparkColor = theme.isBW ? theme.fg : (color || '#ffffff');
  const scope = currentMode === 'MARIO' ? 'mario' : 0;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 2 + Math.random() * 3.2,
      alpha: 1,
      color: sparkColor,
      decay: 0.03 + Math.random() * 0.04,
      scope
    });
  }
};
/**
 * ГОЛОВНИЙ ЦИКЛ З ФІКСОВАНИМ КРОКОМ 60Hz (ОДНАКОВА ШВИДКІСТЬ НА 60Hz, 90Hz І 120Hz!)
 */
const FIXED_STEP = 1000 / 60;
let lastFrameTime = 0;
let accumulator = 0;
function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const elapsed = Math.min(80, Math.max(0, now - lastFrameTime));
  lastFrameTime = now;
  accumulator += elapsed;
  while (accumulator >= FIXED_STEP) {
    if (gameState === 'PLAYING') {
      if (currentMode === 'HOCKEY') updateHockeyPhysics();
      else if (currentMode === 'INVADERS') updateInvadersPhysics();
      else if (currentMode === 'SNAKE') updateSnakePhysics();
      else if (currentMode === 'MARIO') updateMarioPhysics();
    }
    if (gameState === 'PLAYING' || gameState === 'POINT_PAUSE') {
      updateVisualEffects();
    }
    accumulator -= FIXED_STEP;
  }
  ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
  if (currentMode === 'HOCKEY') drawHockeyField();
  else if (currentMode === 'INVADERS') drawInvadersField();
  else if (currentMode === 'SNAKE') drawSnakeField();
  else if (currentMode === 'MARIO') drawMarioSplitScreen();
  drawSharedEffects();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
